name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          PROPTEST_CASES: 512
      - name: Release builds refuse the test KDF parameters
        run: cargo test -p vlt-core --release --test release_gate

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p vlt-core --target wasm32-unknown-unknown --release

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  rustfs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layout: [single, multi]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Start RustFS (${{ matrix.layout }})
        run: |
          scripts/rustfs-up.sh ${{ matrix.layout }} > rustfs.env
          cat rustfs.env >> "$GITHUB_ENV"
      - name: Pull the rc admin client
        run: docker pull rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
      - run: cargo test -p vlt-store --test rustfs
        env:
          VLT_TEST_RUSTFS: "1"
          VLT_REQUIRE_RUSTFS: "1"
      - name: RustFS logs
        if: failure()
        run: docker logs "$VLT_RUSTFS_CONTAINER"
      - name: Stop RustFS
        if: always()
        run: scripts/rustfs-down.sh ${{ matrix.layout }}
