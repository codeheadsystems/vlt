[workspace]
members = ["crates/vlt-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.96"
publish = false

[workspace.dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
ml-kem = { version = "0.3", default-features = false, features = ["alloc", "zeroize", "hazmat"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1", features = ["derive"] }
unicode-normalization = "0.1.25"
getrandom = { version = "0.4", features = ["sys_rng"] }
rand_core = "0.10"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3

[profile.release]
overflow-checks = true
